<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>博客线上编辑后台</title>
<!-- CMS唯一必须读取的配置文件，保留 -->
<link href="/hugo-blog/admin/config.yml" type="application/yaml" rel="cms-config-url">
</head>
<body>
<!-- CMS核心运行脚本，唯一依赖 -->
<script src="/hugo-blog/admin/sveltia-cms.js"></script>
<!-- 等页面全部加载完成再启动，时序最稳妥 -->
<script>
window.onload = function() {
  SVELTIA.start();
};
</script>
</body>
</html>
